# .swiftlint.yml — the ChatBots Swift style, stated once.
#
# Before this file existed, `swiftlint` ran on its built-in defaults and reported ~400
# findings against Sources and Tests with nothing to say which were genuine. An unscoped `swiftlint lint`
# was worse: it also walked `.build/checkouts` and reported ~37,000 findings from
# dependency code. This file states (a) what is linted, (b) where the house style
# deliberately differs from SwiftLint's defaults, and (c) what is left as a real finding
# for someone to fix later. With it in place the same command reports 222 findings at the
# commit that introduced this file, and each one is either a genuine defect or is accounted
# for by a note below.
#
# Nothing is disabled wholesale. Every rule that used to fire still fires unless the note
# beside it explains why the codebase's deliberate style differs from the default.
# `disabled_rules` is empty on purpose.

excluded:
  # Load-bearing: `.build` holds `.build/checkouts` (every dependency's sources) and this
  # repository's build artefacts. Without this line an unscoped `swiftlint lint` reports
  # ~37,000 findings from other people's code against ~400 from ours, so the tool measures
  # the wrong thing. Do not remove.
  - .build
  # Generated web-app bundle; gitignored, never a source of truth.
  - dist
  # Device screenshots written by tools/capture-devices.py; gitignored. (`capture/` is the
  # same class if it ever appears.)
  - captures
  - capture
  # Generated by `tools/embed-web.py` from `web/` — edit `web/`, not this file. 2,564 lines
  # of embedded HTML/CSS/JS written at column 0. It contributes 5 line_length, 1
  # file_length and 1 type_body_length finding, none of which is a statement about code.
  - Sources/ChatBotsCore/WebAssets.swift
  # Generated by `tools/embed-names.py` from `names/`. Contributes 12 line_length findings
  # on generated data lines.
  - Sources/ChatBotsCore/NameLists.swift

disabled_rules: []

line_length:
  # Left at SwiftLint's defaults (warning 120, error 200) deliberately. Of the 124
  # findings, 121 are string content the codebase does not wrap — 90 plain string
  # literals, 21 interpolated, 10 lines inside multiline string literals — and only 3 are
  # code. The generated files above account for 17 of them, so 107 remain. No threshold
  # separates prose from code, and raising `warning` would hide the 3 genuine code lines
  # (122, 125 and 138 characters) along with the prose, so all 107 stay visible as debt.
  warning: 120
  error: 200

trailing_comma:
  # SwiftLint's default *forbids* trailing commas, but this codebase writes them in every
  # multiline collection literal — 93 of the original findings — and swift-format's default
  # (`multiElementCollectionTrailingCommas`) *requires* them. `mandatory_comma` points the
  # rule the same way as the code and the formatter: a multiline literal *without* a
  # trailing comma is now the finding. This re-directs the rule, it does not silence it.
  mandatory_comma: true

opening_brace:
  # House style is K&R, except that when the declaration header is itself wrapped over
  # several lines the brace moves onto its own line (Allman-style). 26 findings, all of
  # that shape. These options accept that deliberate style; a single-line declaration with
  # a misplaced brace is still reported.
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true

identifier_name:
  # The codebase uses two-character prepositional names (`at`, `to`, `on`) and short local
  # names (`ok`, `kv`, `js`, `as`) deliberately: 15 findings. `min_length` is therefore 2.
  # One-character names (`a`, `b`, `c`, `z`; 10 findings) stay flagged as genuine terseness.
  min_length:
    warning: 2
    error: 1
  excluded:
    # `id` is excluded explicitly, and it has to be, because SwiftLint's `excluded:` REPLACES
    # its own default list rather than extending it — the default is `[id]`. Today that makes
    # no difference: `min_length.warning: 2` already masks every `id`, so the measured count is
    # the same either way. It matters the moment anyone raises `min_length`: without this line
    # 109 `id` findings would appear out of a config that claims to state the house style.
    # Written down because it is invisible until it is not.
    - id
    # Field names mirrored verbatim from the Tavily HTTP API's JSON in the request and
    # response DTOs in TavilyClient.swift (`search_depth`, `max_results`, ...). Renaming
    # them would need hand-written CodingKeys and gain nothing; 8 findings.
    - search_depth
    - max_results
    - include_answer
    - include_raw_content
    - raw_content
    - extract_depth
    - failed_results

nesting:
  # Request and response DTOs nest one type (`Response.Item`) inside their function: 4
  # findings. Deeper type nesting and all statement nesting are still reported.
  type_level: 2

file_length:
  # The project organises by domain, not by line count: 22 files exceed SwiftLint's default
  # 400 and several are large on purpose. WebAssets.swift is excluded as generated above.
  # 600/1200 leaves 9 genuinely oversized files visible: ConversationEngine (1,361, error),
  # ChatController (1,275, error), MLXEngine (860), main.swift (840), ChatModels (809),
  # APIServer (755), HTTPServer (648), ResearchDirectorTests (646), OpenAIResponsesClient
  # (638). The 13 files between 400 and 600 are tolerated by this threshold.
  warning: 600
  error: 1200

type_body_length:
  # Container types here hold a whole domain (ConversationEngine, MLXEngine, SocialLibrary).
  # 11 findings at the default 250/350; 400/800 leaves the 4 largest visible
  # (ConversationEngine 839 error, ChatController 762, MLXEngine 492, SocialLibrary 445).
  warning: 400
  error: 800

function_body_length:
  # SwiftLint default 50/100. 21 findings; this codebase's parsers and request handlers do
  # run long. 80/160 leaves the 8 unwieldiest visible: MLXEngine (198, error),
  # EngineService (121), TransportCheck (117), ConflictState (109), main.swift (90),
  # ConflictReader (89), ResearchDirector (89), EngineService (86).
  warning: 80
  error: 160

large_tuple:
  # Three-element tuples are used deliberately to return a small set of related values —
  # 10 findings, all 3-tuples at the default warning of 2. warning 3 accepts them; the two
  # 4-tuples that remain are still reported.
  warning: 3
  error: 4
